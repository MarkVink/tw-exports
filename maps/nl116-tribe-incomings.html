  ctx.strokeStyle=css('--grid2');ctx.lineWidth=1.2;ctx.beginPath();for(let x=Math.ceil(x0/100)*100;x<=x1;x+=100){ctx.moveTo(sx(x),0);ctx.lineTo(sx(x),H)}for(let y=Math.ceil(y0/100)*100;y<=y1;y+=100){ctx.moveTo(0,sy(y));ctx.lineTo(W,sy(y))}ctx.stroke();
  ctx.fillStyle=css('--mut');ctx.font='12px system-ui';
  for(let kx=Math.floor(x0/100);kx<=Math.floor(x1/100);kx++)for(let ky=Math.floor(y0/100);ky<=Math.floor(y1/100);ky++){if(kx<0||ky<0||kx>9||ky>9)continue;if(sx(kx*100)<0&&sx(kx*100+100)<70)continue;if(sy(ky*100)<0&&sy(ky*100+100)<40)continue;ctx.fillText('K'+ky+kx,Math.max(sx(kx*100),0)+5,Math.max(sy(ky*100),0)+15)}
  const sz=Math.max(1.6,s*0.82),o=sz/2;
  const vis=D.villages.filter(v=>v[0]>=x0-1&&v[0]<=x1+1&&v[1]>=y0-1&&v[1]<=y1+1);
  const order=v=>{const p=D.players[v[2]];return !p?0:p[1]<0?1:on[p[1]]?3:2};
  vis.sort((a,b)=>order(a)-order(b));
  ctx.globalAlpha=showAtt?0.45:1;for(const v of vis){ctx.fillStyle=colorOf(v);ctx.fillRect(sx(v[0]+.5)-o,sy(v[1]+.5)-o,sz,sz)}
  ctx.globalAlpha=1;if(hiP>=0){ctx.strokeStyle=css('--ink');ctx.lineWidth=1.5;for(const v of vis)if(v[2]===hiP){const r=Math.max(4,sz*0.9);ctx.strokeRect(sx(v[0]+.5)-r,sy(v[1]+.5)-r,r*2,r*2)}}
  if(showAtt){ctx.lineWidth=Math.max(1,Math.min(2,s/6));ctx.globalAlpha=.85;
    D.attacks.forEach((a,i)=>{if(!aVis(a,i))return;const col=acol(a[4]);ctx.strokeStyle=col;const X1=sx(a[0]+.5),Y1=sy(a[1]+.5),X2=sx(a[2]+.5),Y2=sy(a[3]+.5);ctx.beginPath();ctx.moveTo(X1,Y1);ctx.lineTo(X2,Y2);ctx.stroke();
      const ang=Math.atan2(Y2-Y1,X2-X1),h=Math.max(5,Math.min(9,s));ctx.beginPath();ctx.moveTo(X2,Y2);ctx.lineTo(X2-h*Math.cos(ang-.4),Y2-h*Math.sin(ang-.4));ctx.lineTo(X2-h*Math.cos(ang+.4),Y2-h*Math.sin(ang+.4));ctx.closePath();ctx.fillStyle=col;ctx.fill()})
    ctx.globalAlpha=1}
  if(hov){const r=Math.max(5,sz*0.8);ctx.strokeStyle=css('--ink');ctx.lineWidth=2;ctx.strokeRect(sx(hov[0]+.5)-r,sy(hov[1]+.5)-r,r*2,r*2)}
}
let drag=null,pts=new Map(),pinch=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.offsetX,y:e.offsetY});if(pts.size==1){drag={x:e.offsetX,y:e.offsetY,vx:view.x,vy:view.y,moved:false};cv.classList.add('drag')}else if(pts.size==2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:view.s};drag=null}});
cv.addEventListener('pointermove',e=>{
  if(pts.has(e.pointerId))pts.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
  if(pinch&&pts.size==2){const [a,b]=[...pts.values()];const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;zoomAt(mx,my,pinch.s*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d);return}
  if(drag){const dx=e.offsetX-drag.x,dy=e.offsetY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;view.x=drag.vx-dx/view.s;view.y=drag.vy-dy/view.s;tip.style.display='none';draw();return}
  hover(e.offsetX,e.offsetY)});
const end=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(pts.size==0){drag=null;cv.classList.remove('drag')}};
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);cv.addEventListener('pointerleave',()=>{tip.style.display='none';if(hov){hov=null;draw()}});
function zoomAt(X,Y,ns){ns=Math.max(1,Math.min(60,ns));const a=wx(X),b=wy(Y);view.s=ns;view.x=a-(X-W/2)/ns;view.y=b-(Y-H/2)/ns;draw()}
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.offsetX,e.offsetY,view.s*Math.exp(-e.deltaY*0.0015))},{passive:false});
function hover(X,Y){
  const x=Math.floor(wx(X)),y=Math.floor(wy(Y));let v=byXY.get(x*1000+y);
  if(!v&&view.s<5){let best=null,bd=9;for(let dx=-2;dx<=2;dx++)for(let dy=-2;dy<=2;dy++){const w=byXY.get((x+dx)*1000+y+dy);if(w){const d=dx*dx+dy*dy;if(d<bd){bd=d;best=w}}}v=best}
  if(v!==hov){hov=v;draw()}
  if(!v){tip.style.display='none';return}
  const p=D.players[v[2]];let who='Barbarian village',tr='';
  if(p){who=p[0];tr=p[1]>=0?(T[p[1]].name+' ['+T[p[1]].tag+']'):p[1]==-2?'no tribe':'tribe id '+p[2]}
  const inc=D.attacks.filter((a,i)=>a[2]==v[0]&&a[3]==v[1]&&aVis(a,i)),out=D.attacks.filter((a,i)=>a[0]==v[0]&&a[1]==v[1]&&aVis(a,i));
  let extra='';if(inc.length)extra+=`<div class="s">${inc.length} incoming: ${inc.slice(0,8).map(a=>a[5]+' '+esc(a[4])).join(', ')}${inc.length>8?' …':''}</div>`;if(out.length)extra+=`<div class="s">Sends ${out.length} ram${out.length>1?'s':''}: ${out.map(a=>esc(a[6])+' '+a[5]).join(', ')}</div>`;
  tip.innerHTML=`<b>${esc(v[4])}</b> (${v[0]}|${v[1]}) K${Math.floor(v[1]/100)}${Math.floor(v[0]/100)}<div class="s">${esc(who)}${tr?' · '+tr:''} · ${v[3].toLocaleString()} pts</div>${extra}`;
  tip.style.display='block';const r=tip.getBoundingClientRect();let L=X+14,Tp=Y+14;if(L+r.width>W)L=X-r.width-14;if(Tp+r.height>H)Tp=Y-r.height-14;tip.style.left=L+'px';tip.style.top=Tp+'px'}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('att').onchange=e=>{showAtt=e.target.checked;draw()};
document.getElementById('zi').onclick=fitAtt;document.getElementById('zw').onclick=fitWorld;
document.getElementById('q').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase(),m=document.getElementById('msg');if(!q){hiP=-1;m.textContent='';draw();return}
  const i=D.players.findIndex(p=>p[0].toLowerCase()===q);if(i<0){hiP=-1;m.textContent='';draw();return}
  hiP=i;const vs=D.villages.filter(v=>v[2]===i);m.textContent=vs.length+' villages';if(vs.length){let a=1e9,b=1e9,c=-1e9,d=-1e9;vs.forEach(v=>{a=Math.min(a,v[0]);b=Math.min(b,v[1]);c=Math.max(c,v[0]);d=Math.max(d,v[1])});fitBox(a-8,b-8,c+9,d+9)}else draw()});
init();
</script>
<script>
(function(){
  const hdr=document.querySelector('header');if(!hdr)return;
  const btn=document.createElement('button');btn.className='b';btn.textContent='Coordinates';btn.title='List source and target coordinates of the rams on the map';hdr.appendChild(btn);
  const box=document.createElement('div');box.id='coordpanel';
  box.style.cssText='display:none;border-bottom:.5px solid var(--line);background:var(--panel);padding:8px 14px 10px;font-size:13px;color:var(--ink2)';
  box.innerHTML='<div style="display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:6px"><span id="cpsum"></span><label>Separator <select id="cpsep" style="font:inherit;font-size:13px;padding:2px 6px;border:.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)"><option value=" ">space</option><option value="\\n">new line</option><option value=", ">comma</option></select></label><label><input type="checkbox" id="cpdup"> keep duplicates</label><button class="b" id="cpclose" style="margin-left:auto">Close</button></div>'+
  '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px">'+
  ['src:Sources','tgt:Targets','ram:Rams (source → target, arrival)'].map(s=>{const[k,l]=s.split(':');return `<div><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><b style="font-weight:500;color:var(--ink)">${l}</b> <span class="n" id="cpn_${k}"></span><button class="b" data-copy="${k}" style="padding:2px 8px;margin-left:auto">Copy</button></div><textarea id="cp_${k}" readonly style="width:100%;height:120px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;border:.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);padding:6px;resize:vertical"></textarea></div>`}).join('')+'</div>';
  const wrap=document.getElementById('wrap');wrap.parentNode.insertBefore(box,wrap);
  let open=false,sig='';
  const owner=(x,y)=>{try{const v=byXY.get(x*1000+y);return v&&D.players[v[2]]?D.players[v[2]][0]:(v?'barbarian':'')}catch(e){return''}};
  const vname=(x,y)=>{try{const v=byXY.get(x*1000+y);return v?v[4]:''}catch(e){return''}};
  function visible(){try{if(typeof aVis==='function')return D.attacks.filter((a,i)=>aVis(a,i))}catch(e){}try{return showAtt?D.attacks:[]}catch(e){return D.attacks||[]}}
  function fill(force){
    const vis=visible();const sep=document.getElementById('cpsep').value.replace('\\n','\n');const dup=document.getElementById('cpdup').checked;
    const k=vis.length+'|'+sep+'|'+dup+'|'+(vis[0]?vis[0].slice(0,6).join():'')+'|'+(vis.length?vis[vis.length-1].slice(0,6).join():'');
    if(!force&&k===sig)return;sig=k;
    const sc=new Map(),tc=new Map();vis.forEach(a=>{const s=a[0]+'|'+a[1],t=a[2]+'|'+a[3];sc.set(s,(sc.get(s)||0)+1);tc.set(t,(tc.get(t)||0)+1)});
    const list=(m,key)=>dup?vis.map(key):[...m.keys()];
    const src=list(sc,a=>a[0]+'|'+a[1]),tgt=list(tc,a=>a[2]+'|'+a[3]);
    document.getElementById('cp_src').value=src.join(sep);document.getElementById('cp_tgt').value=tgt.join(sep);
    document.getElementById('cp_ram').value=vis.slice().sort((a,b)=>a[5]<b[5]?-1:1).map(a=>`${a[0]}|${a[1]} → ${a[2]}|${a[3]}  ${a[5]}  ${String(a[4]).replace(/^→ /,'')} → ${owner(a[2],a[3])} (${vname(a[2],a[3])})`).join('\n');
    document.getElementById('cpn_src').textContent=sc.size+' villages';document.getElementById('cpn_tgt').textContent=tc.size+' villages';document.getElementById('cpn_ram').textContent=vis.length+' rams';
    document.getElementById('cpsum').textContent='Lists follow the filters on the map (players, S#, time slider, clicked village).';
  }
  btn.onclick=()=>{open=!open;box.style.display=open?'block':'none';if(open)fill(true);try{resize()}catch(e){}};
  document.getElementById('cpclose').onclick=()=>{open=false;box.style.display='none';try{resize()}catch(e){}};
  document.getElementById('cpsep').onchange=()=>fill(true);document.getElementById('cpdup').onchange=()=>fill(true);
  box.addEventListener('click',e=>{const k=e.target.dataset&&e.target.dataset.copy;if(!k)return;const ta=document.getElementById('cp_'+k);const done=()=>{e.target.textContent='Copied';setTimeout(()=>e.target.textContent='Copy',1200)};
    try{navigator.clipboard.writeText(ta.value).then(done,()=>{ta.select();document.execCommand('copy');done()})}catch(err){ta.select();try{document.execCommand('copy');done()}catch(e2){}}});
  if(typeof draw==='function'){const _d=draw;draw=function(){_d.apply(this,arguments);if(open)fill()}}
})();
